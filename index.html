function computeOutcome(persona, bundle) {
  const baseCost = persona.typicalBase;
  const highCostPressure = (persona.usage.compute * 0.28) + (persona.usage.egress * 0.26) + (persona.usage.branching * 0.22) + (persona.usage.vector * 0.24);
  const humanRisk = (persona.billShockSensitivity * 0.55) + (Math.min(100, persona.volatility * 16) * 0.45);
  const literacyGap = 100 - persona.techLiteracy;

  const expectedBill = bundle.id === 'unlimited-fairuse'
    ? bundle.base
    : baseCost * (1 + (1 - bundle.predictabilityModifier) * 0.35 + (highCostPressure / 100) * 0.08);

  const swingFactor = Math.max(0, persona.volatility - 1);
  const minBill = bundle.id === 'unlimited-fairuse'
    ? bundle.base
    : Math.max(baseCost * 0.55, baseCost * (1 - swingFactor * 0.13 * (1 - bundle.predictabilityModifier)));

  const maxBill = bundle.id === 'unlimited-fairuse'
    ? bundle.base
    : baseCost * (1 + swingFactor * bundle.billShockModifier + (highCostPressure / 100) * 0.2);

  const predictability = Math.max(8, Math.min(98,
    bundle.predictabilityModifier * 100
    - swingFactor * 6
    - (highCostPressure / 100) * 8
  ));

  const trust = Math.max(10, Math.min(98,
    bundle.trustModifier * 70
    + persona.techLiteracy * 0.28
    - (bundle.id === 'metered' ? literacyGap * 0.18 : 0)
    + (bundle.id === 'workload-shaped' ? 8 : 0)
  ));

  const billShockRisk = Math.max(0, Math.min(100,
    bundle.billShockModifier * humanRisk * (0.85 + persona.volatility / 6) + (bundle.id === 'capped' ? highCostPressure * 0.08 : 0)
  ));

  const marginHealth = Math.max(15, Math.min(100,
    bundle.marginHealth
    - swingFactor * 3
    - (bundle.id === 'unlimited-fairuse' ? highCostPressure * 0.35 : 0)
    - (bundle.id === 'metered' ? 0 : highCostPressure * 0.04)
  ));

  let verdict = '';
  let verdictTone = 'neutral';
  if (bundle.id === 'metered') {
    if (persona.techLiteracy > 70) { verdict = 'Sophisticated buyer can model this. Acceptable trade-off, with effort.'; verdictTone = 'ok'; }
    else if (persona.billShockSensitivity > 70) { verdict = 'High probability of a public bill-shock incident based on observed patterns.'; verdictTone = 'bad'; }
    else { verdict = 'Survivable but anxious. Likely churn after the first surprise bill.'; verdictTone = 'warn'; }
  } else if (bundle.id === 'capped') {
    if (persona.id === 'enterprise') { verdict = 'Spend Cap is the wrong primitive for this buyer — they want a contract, not a fence.'; verdictTone = 'warn'; }
    else if (persona.volatility > 4 || highCostPressure > 55) { verdict = "Cap helps the median month. Compute, branches, or egress can still surprise because not every cost surface is covered."; verdictTone = 'warn'; }
    else { verdict = "Today's default. Works for most. Trust holds — until the first compute or branching spike."; verdictTone = 'ok'; }
  } else if (bundle.id === 'unlimited-fairuse') {
    if (persona.volatility > 4 || highCostPressure > 60) { verdict = 'Customer satisfaction high. Negative gross margin risk on heavy-tail outliers. Not sustainable without strict throttles.'; verdictTone = 'bad'; }
    else if (persona.id === 'enterprise') { verdict = "Enterprise doesn't want unlimited; they want a predictable line item with an SLA."; verdictTone = 'warn'; }
    else { verdict = 'Marketable, popular. Margin pressure on the long tail. Manageable only with strict cost-to-serve discipline.'; verdictTone = 'warn'; }
  } else if (bundle.id === 'workload-shaped') {
    if (persona.id === 'vibe-coder') { verdict = "A dollar budget with a hard cap converts the bill into a number this buyer can model. No fake currency required."; verdictTone = 'good'; }
    else if (persona.id === 'ai-startup') { verdict = "AI workload guardrails make agent loops, eval branches, and heavy background jobs legible without gating pgvector or core Postgres capabilities."; verdictTone = 'good'; }
    else if (persona.id === 'b2b-saas') { verdict = "A Scale-tier hypothesis closes the $25 → $599 cliff. SSO included. Procurement-friendly motion."; verdictTone = 'good'; }
    else if (persona.id === 'enterprise') { verdict = "Committed Spend gives sales a procurement-friendly motion. EDP-style for larger commits."; verdictTone = 'good'; }
    else { verdict = "Familiar Pro experience plus optional add-ons at growth points. Path to expansion preserved."; verdictTone = 'good'; }
  }

  return { expectedBill, minBill, maxBill, predictability, trust, billShockRisk, marginHealth, verdict, verdictTone, highCostPressure, humanRisk, literacyGap };
}

function metricReasons(persona, bundle, outcome) {
  const highCost = Math.round(outcome.highCostPressure);
  const vol = persona.volatility.toFixed(1);
  const literacy = persona.techLiteracy;
  return {
    predictability: `${persona.name} has ${vol}x volatility and ${highCost}/100 high-cost pressure. ${bundle.name} ${bundle.predictabilityModifier > 0.8 ? 'compresses the bill into a narrower forecastable range' : bundle.predictabilityModifier > 0.6 ? 'narrows the range but still leaves some exposed meters' : 'leaves most cost surfaces exposed'}.`,
    trust: `${persona.name} starts with ${literacy}/100 technical literacy. Trust rises when the bundle translates meters into a language this buyer recognizes; it falls when the buyer must understand compute, egress, branches, and retries directly.`,
    billShock: `${bundle.name} ${bundle.billShockModifier < 0.3 ? 'reduces surprise by adding dollar budget/cap mechanics' : bundle.billShockModifier < 0.8 ? 'reduces some surprises but still leaves tail events' : 'keeps the heavy-tail risk mostly with the customer'}. Risk is amplified by ${vol}x volatility and non-human traffic patterns.`,
    margin: `Supabase-side health starts from the bundle's margin posture, then adjusts down for volatile workloads and expensive surfaces like compute, egress, branching, and AI/vector usage. Higher customer predictability is not automatically better for margin.`
  };
}

const ValidationPlan = () => {
  const phases = [
    {
      tag: 'Days 1–30',

      bullets: [
        'Read every Pro and Team support ticket from the last 90 days. Tag by meter, by surprise-bill pattern, by Spend-Cap-on-but-bill-still-shocked.',
        'Pull telemetry: distribution of monthly bills (median, p90, p99) by signup source — direct vs. Lovable / Bolt / Cursor referral.',
        'Audit the Spend Cap exclusion list against actual customer surprise events. Quantify: how often does the cap promise fail to hold, and on which line items?',
        'One-on-ones with billing engineering, sales, support, and the founders. Get the internal mental model before forming external recommendations.'
      ]
    },
    {
      tag: 'Days 31–60',
      title: 'Customer interviews and competitive baseline',
      bullets: [
        '30 customer interviews weighted toward monetization: 4 AI-assisted builders, 4 indie devs, 8 mid-stage B2B SaaS or agencies, 6 AI-native startups, 8 Team / Enterprise buyers.',
        'Three core questions per interview: walk me through your last surprise bill. Walk me through how you decided whether to upgrade. What would make you migrate, and to whom?',
        'External pricing comparables refresh — Neon, Vercel, Google/Firebase, Railway, Replit, Lovable, Clerk, Cloudflare. Triangulate on what features get bundled at what price points by stage of buyer.',
        'Internal write-up: prioritized list of the three to five highest-leverage pricing moves, with supporting evidence and risk register.'
      ]
    },
    {
      tag: 'Days 61–90',
      title: 'Test, not ship',
      bullets: [
        'Fake-door tests on the highest-priority hypotheses — pricing-page CTR on a Growth-tier card, dollar-budget language, and AI workload guardrails. Measured against control.',
        'In-product cost-forecast prototype shown to a held-out cohort. Measure: does the dollar-denominated projection reduce surprise-bill incidence in the next billing cycle?',
        'AI workload guardrails private beta: 30–50 RAG / agent customers, six-month telemetry window, gross-margin and NPS measured against control.',
        'Recommendation memo to founders + commercial leadership at day 90. Three recommendations, with evidence, risk register, and a rollback plan for each.'
      ]
    }
  ];

  return (
    <section className="px-6 md:px-12 lg:px-20 py-24 border-t border-stone-800/60 grain-overlay">
      <div className="max-w-6xl mx-auto">
        <SectionHeader
          num="10"

          title="Three months of measurement before any structural change ships."
          lead="The fastest way to land badly on pricing is to ship a recommendation before you have the telemetry to defend it. The plan below is the operating cadence I'd run — listen, instrument, interview, fake-door — and only after that, propose a sequenced shipping plan to the founders."
        />

        <div className="grid md:grid-cols-3 gap-px bg-stone-800/60 border border-stone-800/60">
          {phases.map((phase, i) => (
            <div key={i} className="bg-stone-950 p-7 md:p-8">
              <div className="flex items-center gap-3 mb-5">
                <span className="font-mono text-[10px] tracking-[0.18em] uppercase text-emerald-400 bg-emerald-950/40 px-2 py-1">{phase.tag}</span>
              </div>
              <h3 className="font-display text-2xl text-stone-100 mb-5 leading-tight">{phase.title}</h3>
              <ul className="space-y-3">
                {phase.bullets.map((b, j) => (
                  <li key={j} className="font-body text-sm text-stone-300 leading-relaxed flex gap-3">
                    <span className="text-emerald-700 flex-shrink-0 mt-1.5">▸</span>
                    <span>{b}</span>
                  </li>
                ))}
              </ul>
            </div>
          ))}
        </div>

        <div className="mt-12 grid md:grid-cols-2 gap-10 max-w-5xl">
          <div>
            <Eyebrow className="mb-3">What I would not do in the first 90 days</Eyebrow>
            <ul className="space-y-2 font-body text-sm text-stone-300 leading-relaxed">
              {['Raise the $25 Pro headline.',
                'Restructure the Spend Cap behavior in a way that could increase surprise-bill incidence even temporarily.',
                'Ship pricing changes that would require migration tooling for existing customers without a written rollback plan.',
                'Promise outcome-based or token-based pricing in customer-facing comms before private-beta data is in.'].map((line, i) => (

                'Annual pricing audit cadence — once the budget and guardrail primitives are validated, run a structural review every 12 months, not every 6 like Vercel.'].map((line, i) => (
