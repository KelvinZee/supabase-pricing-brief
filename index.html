   ============================================================ */

function computeOutcome(persona, bundle) {
  const baseCost = persona.typicalBase;
  const expectedBill = baseCost * (1 + (1 - bundle.predictabilityModifier) * 0.3);
  const swingFactor = (persona.volatility - 1);
  const minBill = Math.max(
    bundle.id === 'unlimited-fairuse' ? bundle.base : baseCost * 0.6,
    baseCost * (1 - swingFactor * 0.15 * (1 - bundle.predictabilityModifier))
  );
  const maxBill = bundle.id === 'unlimited-fairuse'
    ? bundle.base
    : baseCost * (1 + swingFactor * bundle.billShockModifier);

  const predictability = Math.max(8, Math.min(98, bundle.predictabilityModifier * 100 - (persona.volatility - 1) * 8));
  const trust = Math.max(10, Math.min(98, bundle.trustModifier * 80 + persona.techLiteracy * 0.25));
  const billShockRisk = Math.max(0, Math.min(100, bundle.billShockModifier * persona.billShockSensitivity * (persona.volatility / 3)));
  const marginHealth = Math.max(15, Math.min(100, bundle.marginHealth - (persona.volatility - 1) * 4));

  let verdict = '';
  let verdictTone = 'neutral';
  if (bundle.id === 'metered') {
    if (persona.techLiteracy > 70) { verdict = 'Sophisticated buyer can model this. Acceptable trade-off, with effort.'; verdictTone = 'ok'; }
    else if (persona.billShockSensitivity > 70) { verdict = 'High probability of a public bill-shock incident based on observed patterns.'; verdictTone = 'bad'; }
    else { verdict = 'Survivable but anxious. Likely churn after the first surprise bill.'; verdictTone = 'warn'; }
  } else if (bundle.id === 'capped') {
    if (persona.id === 'enterprise') { verdict = 'Spend Cap is the wrong primitive for this buyer — they want a contract, not a fence.'; verdictTone = 'warn'; }
    else if (persona.volatility > 4) { verdict = "Cap helps the median month. Compute spike still hits because compute is on the exclusion list."; verdictTone = 'warn'; }
    else { verdict = "Today's default. Works for most. Trust holds — until the first compute spike."; verdictTone = 'ok'; }
  } else if (bundle.id === 'unlimited-fairuse') {
    if (persona.volatility > 4) { verdict = 'Customer satisfaction high. Negative gross margin on heavy-tail outliers. Not sustainable at scale.'; verdictTone = 'bad'; }
    else if (persona.id === 'enterprise') { verdict = "Enterprise doesn't want unlimited; they want a predictable line item with an SLA."; verdictTone = 'warn'; }
    else { verdict = 'Marketable, popular. Margin pressure on the long tail. Manageable only with strict cost-to-serve discipline.'; verdictTone = 'warn'; }
  } else if (bundle.id === 'workload-shaped') {
    if (persona.id === 'vibe-coder') { verdict = "Wallet metaphor plus a dollar-denominated cap converts the bill into a number this buyer can model. Trust mechanism intact."; verdictTone = 'good'; }
    else if (persona.id === 'ai-startup') { verdict = "AI Workloads add-on makes vector storage, branching, and agent loops legible on the invoice. Captured value, intentionally."; verdictTone = 'good'; }
    else if (persona.id === 'b2b-saas') { verdict = "A Scale-tier hypothesis closes the $25 → $599 cliff. SSO included. Procurement-friendly motion."; verdictTone = 'good'; }
    else if (persona.id === 'enterprise') { verdict = "Committed Spend gives sales a procurement-friendly motion. EDP-style for >$50K commits."; verdictTone = 'good'; }
    else { verdict = "Familiar Pro experience plus optional add-ons at growth points. Path to expansion preserved."; verdictTone = 'good'; }
  }

  return { expectedBill, minBill, maxBill, predictability, trust, billShockRisk, marginHealth, verdict, verdictTone };
}
