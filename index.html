<style>
  * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html { scroll-behavior: smooth; }
  body { background: #0c0a09; color: #fafaf9; font-family: 'Newsreader', Georgia, serif; }

  .font-display { font-family: 'Fraunces', Georgia, serif; font-feature-settings: 'ss01' on, 'ss02' on; letter-spacing: -0.02em; }
  .font-body { font-family: 'Newsreader', Georgia, serif; }
  .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'zero' on, 'ss02' on; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulseSoft { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  .anim-fade-up { animation: fadeUp 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .anim-fade-in { animation: fadeIn 0.6s ease-out both; }
  .anim-pulse-soft { animation: pulseSoft 3s ease-in-out infinite; }

  .grain-overlay { position: relative; }
  .grain-overlay::after {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml;utf8,<svg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.7'/></svg>");
    opacity: 0.035; mix-blend-mode: overlay;
  }
  .grain-overlay > * { position: relative; z-index: 1; }

  .scrollbar-thin::-webkit-scrollbar { height: 6px; width: 6px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(120,120,120,0.25); border-radius: 3px; }

  .editorial-rule { height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); }

  .num-display { font-feature-settings: 'tnum' on, 'lnum' on; font-variant-numeric: tabular-nums lining-nums; }

  .ring-inset-emerald { box-shadow: inset 0 0 0 1px rgba(16, 185, 129, 0.4); }

  /* Print styles */
  @media print {
    body { background: white; color: black; }
    .grain-overlay::after { display: none; }
  }
</style>
